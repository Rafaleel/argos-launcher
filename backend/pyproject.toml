[project]
name = "argos"
version = "0.1.0"
description = "Argos Launcher: local game library manager"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "numpy>=2.0", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
